<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login Portal - Authorized Access Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">Secure Login Portal</h1>
            <p class="text-gray-400 text-sm mt-1">Authorized users ke liye personal dashboard access</p>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Username</label>
                <input type="text" id="username" required placeholder="Apna username dalein" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-md">Sign In</button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-400">
            ⚠️ Agar aapke paas account nahi hai, toh Admin se contact karein.
        </div>
    </div>

    <script>
        const authForm = document.getElementById('authForm');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Direct login action backend ko bhej rahe hain
            const res = await fetch('auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', username, password })
            });

            const data = await res.json();
            alert(data.message);

            if (data.status === 'success') {
                if(data.role === 'admin') {
                    window.location.href = 'admin.php'; // Admin sidha control panel par
                } else {
                    window.location.href = 'index.php'; // Normal user Kirana tracker par
                }
            }
        });
    </script>
</body>
</html>
