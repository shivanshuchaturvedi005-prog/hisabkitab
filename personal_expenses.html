<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Mera Apna Private Kharcha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="mb-4">
            <a href="dashboard.php" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">← Back to Dashboard</a>
        </div>

        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">💰 Mera Personal Kharcha</h1>
            <p class="text-gray-500 mt-1">Aapka private pocket expense tracker (Roommates se alag)</p>
        </header>

        <div class="bg-white p-5 rounded-xl border border-gray-200 mb-6 text-center shadow-sm">
            <p class="text-sm font-medium text-gray-400 uppercase">Mera Total Kharcha</p>
            <p id="personalTotal" class="text-3xl font-bold text-indigo-600">₹0.00</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Kharcha Jodein</h2>
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Kahan kharch kiya?</label>
                        <input type="text" id="title" required placeholder="e.g., Chai, Mobile Recharge" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Amount (₹)</label>
                        <input type="number" id="amount" step="any" required placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Tareekh (Date)</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition">Save Expense</button>
                </form>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Kharcho Ki History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b text-gray-400 text-xs uppercase">
                                <th class="pb-2">Details</th>
                                <th class="pb-2 text-right">Amount</th>
                                <th class="pb-2 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenseRows" class="text-sm divide-y">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();
        const form = document.getElementById('expenseForm');

        async function fetchExpenses() {
            const res = await fetch('personal_expenses_server.php');
            const data = await res.json();
            const tbody = document.getElementById('expenseRows');
            let total = 0;
            tbody.innerHTML = '';

            data.forEach(item => {
                const amt = parseFloat(item.amount) || 0;
                total += amt;
                tbody.innerHTML += `
                    <tr>
                        <td class="py-2">
                            <div class="font-bold text-gray-800">${item.title}</div>
                            <div class="text-xs text-gray-400">${item.date}</div>
                        </td>
                        <td class="py-2 text-right font-bold text-gray-900">₹${amt.toFixed(2)}</td>
                        <td class="py-2 text-center">
                            <button onclick="deleteExpense('${item.id}')" class="text-red-500 hover:underline text-xs">Delete</button>
                        </td>
                    </tr>`;
            });

            document.getElementById('personalTotal').innerText = '₹' + total.toFixed(2);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;

            await fetch('personal_expenses_server.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'add', title, amount, date })
            });
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            fetchExpenses();
        });

        async function deleteExpense(id) {
            if(confirm('Kharche ko delete karein?')) {
                await fetch('personal_expenses_server.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id })
                });
                fetchExpenses();
            }
        }
        fetchExpenses();
    </script>
</body>
</html>
