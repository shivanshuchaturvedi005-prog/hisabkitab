<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Secure Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="mb-4">
            <a href="dashboard.php" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">← Back to Dashboard</a>
        </div>

        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-indigo-600">🔑 Personal Notes & Diary</h1>
            <p class="text-gray-500 mt-1">Aapki secure personal diary ya zaroori information locker</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">Naya Note Likhein</h2>
                <form id="noteForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Heading / Title</label>
                        <input type="text" id="title" required placeholder="e.g., Important Links, My Goal" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Note Body Description</label>
                        <textarea id="content" rows="5" required placeholder="Apni zaruri baatein yahan likhein..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition">Save Note Securely</button>
                </form>
            </div>

            <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4" id="notesContainer">
                </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('noteForm');

        async function fetchNotes() {
            const res = await fetch('notes_server.php');
            const data = await res.json();
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            data.forEach(note => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-gray-900 text-base mb-1 border-b pb-1">${note.title}</h3>
                            <p class="text-gray-600 text-sm whitespace-pre-line mt-2">${note.content}</p>
                        </div>
                        <div class="mt-4 flex justify-between items-center text-[11px] text-gray-400">
                            <span>Saved: ${note.timestamp}</span>
                            <button onclick="deleteNote('${note.id}')" class="text-red-500 hover:text-red-700 font-medium">Delete</button>
                        </div>
                    </div>`;
            });

            if(data.length === 0) {
                container.innerHTML = '<p class="text-gray-400 italic text-sm col-span-2">Diary khali hai. Kuch safe notes add kijiye!</p>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            await fetch('notes_server.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'add', title, content })
            });
            form.reset();
            fetchNotes();
        });

        async function deleteNote(id) {
            if(confirm('Kya aap is note ko hamesha ke liye delete karna chahte hain?')) {
                await fetch('notes_server.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id })
                });
                fetchNotes();
            }
        }
        fetchNotes();
    </script>
</body>
</html>
